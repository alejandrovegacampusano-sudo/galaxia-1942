function mk(rows, pal) {

function spr(img, x, y, a = 0, sx = 1, sy = 1) {

  if (a) ctx.rotate(a);

const ocean = document.createElement('canvas'); ocean.width = W; ocean.height = H;
{

function blob(w, h, stops, squash = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const a = [rnd(0, 6), rnd(0, 6), rnd(0, 6)];
  const R = Math.min(w, h * squash) / 2 * .6, cx = w / 2, cy = h / 2;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = x - cx, dy = (y - cy) * squash, t = Math.atan2(dy, dx);
    const r = R * (1 + .18 * Math.sin(3 * t + a[0]) + .12 * Math.sin(5 * t + a[1]) + .07 * Math.sin(9 * t + a[2]));
    const d = Math.hypot(dx, dy) / r;
    for (const [th, col, alt] of stops) {

}
let bgY = 0, islands = [], clouds = [], islandT = 3, cloudT = 1, carrierY = H + 200;
function newIsland(y) {
  const s = rnd(36, 80) | 0;
  const img = blob(s, s, [[.5, '#2f6e2c', '#245a22'], [.82, '#4b9a3c', '#3c8530'], [1, '#d9c57f', '#c9b36c'], [1.2, '#2c74b8']]);

}

  const img = blob(w, h, [[.75, 'rgba(255,255,255,.95)'], [1, 'rgba(215,228,242,.8)']], 2);

}
newIsland(rnd(20, 120)); newIsland(rnd(160, 240)); newCloud(rnd(0, 200));
function updBg(dt) {
  const v = 18;
  bgY = (bgY + v * dt) % H;
  carrierY += v * dt;
  for (const i of islands) i.y += v * dt;
  for (const c of clouds) c.y += c.v * dt;
  islands = islands.filter(i => i.y < H + 4);

  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 15, y - 56, 30, 2);

// ---------------- Audio ----------------
let AC = null, muted = false, nbuf = null;

}

  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();

  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);

  if (!AC || muted) return;
  if (!nbuf) {
    nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const a = nbuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;

  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; fl.type = 'lowpass';

  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);

const sfx = {

  hit: () => tone(320, .08, 'square', .05, 150),
  boom: () => noise(.35, .25, 1600),

  beam: () => tone(rnd(480, 720), .13, 'triangle', .035, rnd(300, 900)),
  cap: () => { for (let i = 0; i < 7; i++) tone(820 - i * 80, .18, 'square', .04, 0, i * .16); },
  pow: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .1, 'square', .04, 0, i * .07)),
  roll: () => tone(260, .6, 'triangle', .06, 900),

const K = {};
const touch = { active: false, x: 0, y: 0, ox: 0, oy: 0 };

}

  if (state === 'gameover' && goT > 1.5 && (c === 'Space' || c === 'Enter')) { state = 'title'; return; }
  if (state === 'play') {
    if (c === 'KeyP' || c === 'Escape') { paused = !paused; return; }
    if (paused && (c === 'Space' || c === 'Enter')) { paused = false; return; }

  }

// ---------------- Rutas (Catmull-Rom) ----------------
function spline(pts, step = 2) {
  const out = [], p = [pts[0], ...pts, pts[pts.length - 1]];
  for (let i = 1; i < p.length - 2; i++) {
    const p0 = p[i - 1], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2];
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
const PATHS = {
  top: [[96, -16], [96, 40], [78, 110], [48, 160], [38, 200], [58, 226], [90, 216], [100, 182], [88, 140]],
  bottom: [[-16, 250], [40, 222], [92, 190], [122, 150], [118, 108], [96, 92], [76, 112], [88, 140], [112, 128]],
  side: [[-16, 70], [56, 84], [108, 122], [128, 170], [108, 204], [78, 194], [68, 160], [90, 122]],
  squad: [[-16, 200], [50, 180], [110, 140], [150, 150], [140, 190], [100, 196], [90, 160], [130, 120], [190, 100], [W + 20, 80]],

const pathCache = {};
function getPath(name, m) {
  const key = name + m;
  if (!pathCache[key]) pathCache[key] = spline(PATHS[name].map(([x, y]) => [m ? W - x : x, y]));
  return pathCache[key];
}
// Oleadas: cada grupo tiene dos columnas de 4 aviones -> casilla [fila, col] de la formacion
const GROUPS = [
  [{ p: 'top', m: 0, s: [[3, 3], [3, 4], [3, 5], [3, 6]] }, { p: 'top', m: 1, s: [[4, 3], [4, 4], [4, 5], [4, 6]] }],
  [{ p: 'bottom', m: 0, s: [[0, 3], [0, 4], [0, 5], [0, 6]] }, { p: 'bottom', m: 0, d: .09, s: [[1, 3], [1, 4], [1, 5], [1, 6]] }],
  [{ p: 'bottom', m: 1, s: [[1, 1], [1, 2], [1, 7], [1, 8]] }, { p: 'bottom', m: 1, d: .09, s: [[2, 1], [2, 2], [2, 7], [2, 8]] }],
  [{ p: 'side', m: 0, s: [[2, 3], [2, 4], [2, 5], [2, 6]] }, { p: 'side', m: 0, d: .09, s: [[3, 0], [3, 1], [3, 8], [3, 9]] }],

];

let state = 'title', paused = false, t = 0, titleT = 0, goT = 0;

// ---------------- Movimiento de enemigos ----------------
function follow(e, dt) {

    const [tx, ty] = e.path[e.pi + 1], dx = tx - e.x, dy = ty - e.y, L = Math.hypot(dx, dy);

  if (dy < 30) return;
  const L = Math.hypot(dx, dy);

}

}
const beamHW = (e, y) => 4 + (y - (e.y + 8)) * .2;

function updEnemy(e, dt) {
  const ox = e.x, oy = e.y;
  if (e.flash > 0) e.flash -= dt;
  switch (e.state) {
    case 'wait':
      if ((e.delay -= dt) <= 0) {
        e.state = e.kind === 'squad' ? 'fly' : 'enter';
        e.x = e.path[0][0]; e.y = e.path[0][1]; e.pi = 0;
      }
      return;
    case 'enter':
      if (follow(e, dt)) e.state = 'toSlot';

    case 'toSlot': {
      const [sx, sy] = slotPos(e.row, e.col), dx = sx - e.x, dy = sy - e.y, L = Math.hypot(dx, dy), s = e.speed * 1.1 * dt;
      if (L <= s) { e.x = sx; e.y = sy; e.state = 'form'; }
      else { e.x += dx / L * s; e.y += dy / L * s; }

      e.ang = lerpA(e.ang, 0, Math.min(1, dt * 6));

    case 'dive': case 'fly':

      if (e.beamT > .4 && e.beamT < 3.6 && !holding) {
        if ((e.beamSnd = (e.beamSnd || 0) - dt) <= 0) { sfx.beam(); e.beamSnd = .12; }

function startDive(e, off = 0, lead = null) {

  if (tp === 'bomber') pts.push([px - dir * 44 + off, 140], [px + dir * 36 + off, 190], [px - dir * 20 + off, 236], [px + off + j, H + 24]);
  else if (tp === 'boss') pts.push([px + off + j, 150], [px + off - j, 210], [px + off + dir * 30, H + 24]);
  else pts.push([px + off + j, 160], [px + off + j * 2, 230], [px + off + j * 3, H + 24]);
  e.path = spline(pts); e.pi = 0; e.state = 'dive'; e.fireT = rnd(.2, 1); e.beamDive = false;

}
function beamDive(e) {
  const dir = e.x < W / 2 ? -1 : 1, tx = clamp(player.x, 28, W - 28);
  e.path = spline([[e.x, e.y], [e.x + dir * 10, e.y - 12], [e.x + dir * 22, e.y - 4], [e.x + dir * 24, e.y + 16], [tx, 120], [tx, 158]]);

}
function launchDive() {

  if (!form.length) return;
  const diving = enemies.filter(e => (e.state === 'dive' || e.state === 'beam') && !e.once).length;
  if (diving >= 2 + Math.floor(stage / 2)) return;
  const e = form[Math.random() * form.length | 0];
  if (e.type === 'boss') {
    const beamFree = !e.captive && !capture && !rescue && player.alive && !player.dual &&
      !enemies.some(o => o.captive || o.state === 'beam' || o.beamDive);
    if (beamFree && Math.random() < .5) { beamDive(e); return; }
    startDive(e);
    form.filter(o => o.type === 'bomber' && o.row === 1 && Math.abs(o.col - e.col) <= 1).slice(0, 2)

// ---------------- Jugador ----------------
function doRoll() {
  const p = player;

  p.roll = 1.1; rolls--; sfx.roll();
}
function pb(x, y, vx) { pbullets.push({ x, y, vx, vy: -320 }); }
function shoot() {
  const p = player, guns = p.dual ? [p.x, p.x + 16] : [p.x];
  for (const gx of guns) {
    if (p.weapon === 1) pb(gx, p.y - 8, 0);
    else { pb(gx - 3, p.y - 8, 0); pb(gx + 3, p.y - 8, 0); }
    if (p.weapon >= 3) { pb(gx - 6, p.y - 4, -70); pb(gx + 6, p.y - 4, 70); }
  }

}
function updPlayer(dt) {
  const p = player;
  if (!p.alive) {
    if (respawnT > 0 && (respawnT -= dt) <= 0) {
      Object.assign(p, { alive: true, x: W / 2, y: H - 30, inv: 2.2, roll: 0, cool: .3 });
    }
    return;
  }
  const mx = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0);
  const my = (K.ArrowDown || K.KeyS ? 1 : 0) - (K.ArrowUp || K.KeyW ? 1 : 0);
  const sp = 96;

    const dx = touch.x + touch.ox - p.x, dy = touch.y + touch.oy - p.y, L = Math.hypot(dx, dy), m = Math.min(L, sp * 1.8 * dt);
    if (L > .5) { p.x += dx / L * m; p.y += dy / L * m; }

  if (p.roll > 0) p.roll -= dt;

function shipsHit(x, y, rx, ry) {

  if (Math.abs(x - p.x) < rx && Math.abs(y - p.y) < ry) return 0;

}
function hitPlayer(which) {
  const p = player;
  if (p.dual) {
    boom(which ? p.x + 16 : p.x, p.y, true);
    if (which === 0) p.x += 16;
    p.dual = false; p.inv = 1.2; return;
  }
  boom(p.x, p.y, true);
  p.alive = false; p.weapon = Math.max(1, p.weapon - 1); touch.active = false;

}
function loseLife() {
  if (lives > 0) { lives--; respawnT = 2.6; }
  else { state = 'gameover'; goT = 0; try { localStorage.setItem('galaxia1942hi', hi); } catch (e) {} }
}

// ---------------- Danos a enemigos ----------------
function hitEnemy(e) {
  e.hp--; e.flash = .08;
  if (e.hp > 0) { sfx.hit(); return; }
  killEnemy(e);
}
function killEnemy(e) {
  e.dead = true;
  const diving = e.state === 'dive' || e.state === 'beam' || e.state === 'fly';
  let pts = PTS[e.type][diving ? 1 : 0];
  if (e.type === 'boss' && diving && e.captive) pts = 800;
  addScore(pts);
  if (pts >= 400) pops.push({ x: e.x, y: e.y, s: '' + pts, l: 1 });
  boom(e.x, e.y, e.type === 'boss');
  if (e.type === 'red') {
    const sq = squads[e.squad];
    if (++sq.killed === 5) {
      addScore(1000); pops.push({ x: e.x, y: e.y - 8, s: '1000', l: 1.2 });
      items.push({ x: clamp(e.x, 12, W - 12), y: clamp(e.y, 20, 200), kind: player.weapon < 3 && Math.random() < .75 ? 'P' : Math.random() < .25 ? '1' : 'R' });
    }
  }
  if (capture && capture.boss === e) {
    Object.assign(player, { alive: true, x: clamp(capture.x, 8, W - 8), y: H - 30, inv: 2 });
    capture = null; showMsg('LIBERADO!', '#5f5');
  }
  if (e.captive) {
    const [cx, cy] = captivePos(e);
    if (diving && player.alive && !player.dual && !rescue) {
      rescue = { x: cx, y: cy, a: 0 }; showMsg('CAZA RESCATADO', '#5f5');
    } else {
      enemies.push(newEnemy('hostile', -1, -1, spline([[cx, cy], [cx, cy + 30], [player.x, 170], [player.x + rr(40), H + 24]]), 0,
        { state: 'dive', x: cx, y: cy, ang: 0, once: true, speed: 120, fireT: .5 }));
      showMsg('CAZA PERDIDO', '#ff5050');
    }
  }
}

// ---------------- Efectos ----------------
function boom(x, y, big) {
  const n = big ? 34 : 16;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(20, big ? 110 : 70);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.3, big ? 1 : .6), c: ['#fff', '#ffd23f', '#ff8a1f', '#e8341c'][Math.random() * 4 | 0] });
  }
  rings.push({ x, y, l: big ? .5 : .3, m: big ? .5 : .3, R: big ? 22 : 12 });
  big ? sfx.big() : sfx.boom();
}
function updFx(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt + 18 * dt; p.vx *= .97; p.vy *= .97; p.l -= dt; }
  for (const r of rings) r.l -= dt;
  for (const p of pops) { p.y -= 14 * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0); rings = rings.filter(r => r.l > 0); pops = pops.filter(p => p.l > 0);
  if (msg && (msg.l -= dt) <= 0) msg = null;
}

// ---------------- Update ----------------
function update(dt) {
  t += dt;
  updBg(dt);
  if (state === 'title') { titleT += dt; return; }
  if (state === 'gameover') { goT += dt; updFx(dt); for (const e of enemies) updEnemy(e, dt); enemies = enemies.filter(e => !e.dead); return; }
  if (paused) return;

  formT += dt;
  swayAmp = allIn ? Math.max(0, swayAmp - dt * 8) : 12;
  breathAmp = allIn ? Math.min(1, breathAmp + dt * .5) : 0;

  updPlayer(dt);

  if (intro > 0) intro -= dt;
  else {
    stageT += dt;
    if (groupIdx < GROUPS.length) {
      groupT -= dt;
      const entering = enemies.some(e => e.kind !== 'squad' && (e.state === 'wait' || e.state === 'enter'));
      if (groupT <= 0 && !entering) { spawnGroup(GROUPS[groupIdx]); groupIdx++; groupT = 1.2; }
    } else if (!allIn && enemies.every(e => e.kind === 'squad' || e.type === 'hostile' || !['wait', 'enter', 'toSlot'].includes(e.state))) allIn = true;
    if (squadIdx < squadPlan.length && stageT >= squadPlan[squadIdx]) { launchSquad(); squadIdx++; }
    if (allIn || (stage >= 3 && groupIdx >= 3)) {
      if ((diveT -= dt) <= 0) {
        diveT = Math.max(.5, 2.4 - stage * .16) * rnd(.6, 1.3);
        if (player.alive) launchDive();
      }
    }
    if (stage >= 2 && (formFireT -= dt) <= 0) {
      formFireT = rnd(1.5, 3) / (1 + stage * .15);
      const f = enemies.filter(e => e.state === 'form');
      if (f.length) eshoot(f[Math.random() * f.length | 0]);
    }
  }

  for (const e of enemies) updEnemy(e, dt);

  // captura con rayo tractor
  if (capture) {
    const c = capture, b = c.boss; c.a += dt * 14;
    const tx = b.x, ty = b.y - 14, dx = tx - c.x, dy = ty - c.y, L = Math.hypot(dx, dy), s = 40 * dt;
    if (L <= s) {
      b.captive = true; capture = null; b.state = 'toSlot';
      loseLife();
    } else { c.x += dx / L * s; c.y += dy / L * s; }
  }

    else {

      } else { r.x += dx / L * s; r.y += dy / L * s; }
    }
  }

  // balas del jugador
  for (const b of pbullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const e of enemies) {
      if (e.dead || e.state === 'wait') continue;
      if (e.captive) {
        const [cx, cy] = captivePos(e);
        if (Math.abs(b.x - cx) < 6 && Math.abs(b.y - cy) < 7) {
          e.captive = false; b.dead = true; boom(cx, cy, false); showMsg('CAZA PERDIDO', '#ff5050'); break;
        }
      }
      const r = e.type === 'boss' ? 9 : 7;
      if (Math.abs(b.x - e.x) < r && Math.abs(b.y - e.y) < r) { b.dead = true; hitEnemy(e); break; }
    }
  }
  pbullets = pbullets.filter(b => !b.dead && b.y > -10 && b.x > -10 && b.x < W + 10);

  // balas enemigas
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    const w = shipsHit(b.x, b.y, 4, 5);
    if (w >= 0) { b.dead = true; hitPlayer(w); }
  }
  ebullets = ebullets.filter(b => !b.dead && b.y < H + 8 && b.y > -8 && b.x > -8 && b.x < W + 8);

  // choques
  for (const e of enemies) {
    if (e.dead || e.state === 'wait' || e.state === 'form') continue;
    const w = shipsHit(e.x, e.y, 9, 9);
    if (w >= 0) { killEnemy(e); hitPlayer(w); }
  }
  enemies = enemies.filter(e => !e.dead);

  // items POW
  for (const it of items) {
    it.y += 26 * dt; it.x += Math.sin(t * 3 + it.y * .05) * 12 * dt;
    if (player.alive && (Math.abs(it.x - player.x) < 11 || (player.dual && Math.abs(it.x - player.x - 16) < 11)) && Math.abs(it.y - player.y) < 11) {
      it.dead = true; sfx.pow();
      if (it.kind === 'P') { if (player.weapon < 3) { player.weapon++; showMsg('POTENCIA ' + player.weapon, '#ffd23f'); } else { addScore(2000); showMsg('2000 PTS', '#ffd23f'); } }
      else if (it.kind === 'R') { rolls++; showMsg('+1 LOOP', '#5fd0ff'); }
      else { lives++; showMsg('1UP!', '#5f5'); }
    }
  }
  items = items.filter(i => !i.dead && i.y < H + 10);

  updFx(dt);

  if (state === 'play' && intro <= 0 && clearT === 0 && groupIdx >= GROUPS.length && squadIdx >= squadPlan.length && !enemies.length && !capture && !rescue) {
    clearT = 2.6; showMsg('STAGE ' + stage + ' COMPLETO', '#ffd23f', 2.6); sfx.clear();
  }
  if (clearT > 0 && (clearT -= dt) <= 0) { clearT = 0; stage++; startStage(); }
}

// ---------------- Dibujo ----------------

}
function eImg(e) {

}

  const cols = ['#5fd0ff', '#b46bff', '#ffffff', '#5fd0ff'];
  for (let y = 0; y < bl; y += 3) {

    ctx.globalAlpha = .45;
    ctx.fillStyle = cols[((y / 3 | 0) + (t * 12 | 0)) % 4];

}

    spr(img, x, y - Math.sin(k * Math.PI) * 14, 0, s, sy * s);

  }

  if ((t * 30 | 0) % 2) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(x) - 6, Math.round(y) + 5, 1, 2); ctx.fillRect(Math.round(x) + 6, Math.round(y) + 5, 1, 2); }
}

function draw() {
  const oy = bgY | 0;
  ctx.drawImage(ocean, 0, oy - H); ctx.drawImage(ocean, 0, oy);
  for (const i of islands) ctx.drawImage(i.img, Math.round(i.x), Math.round(i.y));
  if (state === 'title') {
    ctx.globalAlpha = .5; for (const c of clouds) ctx.drawImage(c.img, Math.round(c.x), Math.round(c.y)); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(5,7,13,.45)'; ctx.fillRect(0, 0, W, H);
    drawTitle(); return;
  }
  drawCarrier();

  // sombras
  ctx.globalAlpha = .25;
  for (const e of enemies) if (e.state !== 'wait') spr(SHADOW[e.type], e.x + 7, e.y + 10, e.ang + (e.type === 'hostile' ? Math.PI : 0), .8, .8);
  if (player.alive) {
    spr(SHADOW.player, player.x + 8, player.y + 12, 0, .8, .8);
    if (player.dual) spr(SHADOW.player, player.x + 24, player.y + 12, 0, .8, .8);
  }
  ctx.globalAlpha = 1;

  for (const it of items) {
    const x = Math.round(it.x), y = Math.round(it.y);
    ctx.fillStyle = (t * 6 | 0) % 2 ? '#e22' : '#ffd23f'; ctx.fillRect(x - 7, y - 6, 14, 12);
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 6, y - 5, 12, 10);
    txt(it.kind, x + 1, y - 3, '#e22', 'center');
  }
  for (const e of enemies) if (e.state === 'beam') drawBeam(e);
  for (const e of enemies) {
    if (e.state === 'wait') continue;
    spr(eImg(e), e.x, e.y, e.ang + (e.type === 'hostile' ? Math.PI : 0));
    if (e.captive) { const [cx, cy] = captivePos(e); spr(SPR.captive, cx, cy, e.ang + Math.PI); }
  }
  if (capture) spr(SPR.player, capture.x, capture.y, capture.a);
  if (rescue) spr(SPR.player, rescue.x, rescue.y, rescue.a);

  const p = player;
  if (p.alive && !(p.inv > 0 && (t * 16 | 0) % 2)) {
    drawShip(p.x, p.y, SPR.player, p.roll);
    if (p.dual) drawShip(p.x + 16, p.y, SPR.player, p.roll);
  }

  ctx.fillStyle = '#fff6b0';
  for (const b of pbullets) ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 3, 2, 6);
  for (const b of ebullets) {
    ctx.fillStyle = (t * 20 | 0) % 2 ? '#ff5a2a' : '#ffd23f';
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 2, 3, 3);
  }
  for (const pt of parts) { ctx.fillStyle = pt.c; ctx.fillRect(pt.x | 0, pt.y | 0, 2, 2); }
  for (const r of rings) {
    ctx.strokeStyle = 'rgba(255,240,200,' + (r.l / r.m) + ')'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, (1 - r.l / r.m) * r.R + 2, 0, TAU); ctx.stroke();
  }
  for (const pp of pops) txt(pp.s, pp.x, pp.y, '#5fd0ff', 'center');

  ctx.globalAlpha = .5; for (const c of clouds) ctx.drawImage(c.img, Math.round(c.x), Math.round(c.y)); ctx.globalAlpha = 1;

  drawHUD();
  if (intro > 0) { txt('STAGE ' + stage, W / 2, H / 2 - 20, '#ffd23f', 'center'); if (intro < 1.6) txt('PREPARADO', W / 2, H / 2 - 4, '#fff', 'center'); }
  if (msg) txt(msg.s, W / 2, H / 2 + 14, msg.c, 'center');
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, H / 2 - 34, W, 64);
    txt('GAME OVER', W / 2, H / 2 - 24, '#ff4040', 'center', 16);
    txt('PUNTOS ' + score, W / 2, H / 2, '#fff', 'center');
    if (goT > 1.5 && (t * 2 | 0) % 2) txt('PULSA ESPACIO', W / 2, H / 2 + 14, '#ffd23f', 'center');
  }
  if (paused) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); txt('PAUSA', W / 2, H / 2 - 4, '#fff', 'center', 16); }
}

// ---------------- Bucle ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</html>
