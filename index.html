<script>
'use strict';
// =====================================================================
//  GALAXIA 1942 — shooter moderno: un caza de 1942 contra una invasion
//  alienigena. Formaciones y rayo tractor de Galaga, escuadrillas de 1942.
// =====================================================================
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a), rr = a => rnd(-a, a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const normA = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const lerpA = (a, b, k) => normA(a + normA(b - a) * clamp(k, 0, 1));
const pick = a => a[Math.random() * a.length | 0];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const H = 900;
let W = 720, VS = 1;
function resize() {
  // con la pestana oculta el tamano puede llegar en 0: se usa un aspecto por defecto
  const iw = innerWidth || 720, ih = innerHeight || 900;
  W = Math.round(clamp(H * iw / ih, 600, 1500));
  const s = Math.min(iw / W, ih / H), dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  VS = s * dpr;
  if (window.sceneryReady) onResizeScenery();
}
addEventListener('resize', resize); resize();

let hi = 50000;
try { hi = +localStorage.getItem('galaxia1942v2') || 50000; } catch (e) {}

// ----------------------------------------------------------- helpers de dibujo
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function rrect(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
const glowCache = {};
function glow(col) {
  if (!glowCache[col]) {
    const c = canvas(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, col + 'ff'); gr.addColorStop(.22, col + '99'); gr.addColorStop(.5, col + '33'); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache[col] = c;
  }
  return glowCache[col];
}
function addGlow(x, y, r, col, a = 1) {
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  ctx.drawImage(glow(col), x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
const rgbCache = {};
function shade(h, k) {
  const c = rgbCache[h] || (rgbCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
  const t = k > 0 ? 255 : 0, a = Math.min(1, Math.abs(k));
  return 'rgb(' + c.map(v => Math.round(v + (t - v) * a)).join(',') + ')';
}
const SS = 2;
function makeSpr(size, fn) {
  const c = canvas(size * SS, size * SS), g = c.getContext('2d');
  g.scale(SS, SS); g.translate(size / 2, size / 2); fn(g); return c;
}
function silhouette(src) {
  const c = canvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  return c;
}

// ----------------------------------------------------------- sprites alienigenas
const SP = {};
SP.drone = makeSpr(64, g => {
  g.shadowColor = '#59ff9a'; g.shadowBlur = 10;
  g.fillStyle = '#1f7a48';
  for (const k of [-1, 1]) {
    g.beginPath(); g.moveTo(k * 8, -8); g.quadraticCurveTo(k * 28, -12, k * 23, 13);
    g.quadraticCurveTo(k * 19, 2, k * 8, 6); g.closePath(); g.fill();
  }
  let gr = g.createRadialGradient(-3, -6, 1, 0, 0, 16);
  gr.addColorStop(0, '#e6fff0'); gr.addColorStop(.35, '#59ff9a'); gr.addColorStop(1, '#0b4a2a');
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 12, 15, 0, 0, TAU); g.fill();
  g.shadowBlur = 0; g.strokeStyle = 'rgba(0,50,25,.55)'; g.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-9, 2 + i * 4); g.quadraticCurveTo(0, 5 + i * 4, 9, 2 + i * 4); g.stroke(); }
  g.fillStyle = '#062214'; g.beginPath(); g.ellipse(0, -7, 6, 5, 0, 0, TAU); g.fill();
  g.shadowColor = '#ff3060'; g.shadowBlur = 8; g.fillStyle = '#ff3060'; g.beginPath(); g.arc(0, -7, 3, 0, TAU); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-1, -8, 1, 0, TAU); g.fill();
});
SP.mantis = makeSpr(72, g => {

  for (const k of [-1, 1]) {

    g.beginPath(); g.moveTo(k * 5, -6); g.bezierCurveTo(k * 30, -26, k * 38, 2, k * 31, 24);
    g.quadraticCurveTo(k * 22, 6, k * 5, 9); g.closePath(); g.fill();
    g.shadowBlur = 0; g.fillStyle = 'rgba(210,170,255,.35)';
    g.beginPath(); g.moveTo(k * 8, -3); g.bezierCurveTo(k * 26, -16, k * 31, 0, k * 28, 14);
    g.quadraticCurveTo(k * 20, 4, k * 8, 6); g.closePath(); g.fill(); g.shadowBlur = 12;
  }
  const gr = g.createLinearGradient(0, -22, 0, 24);
  gr.addColorStop(0, '#f0e0ff'); gr.addColorStop(.4, '#a15cf0'); gr.addColorStop(1, '#2a0d52');
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 3, 7, 21, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(0, -18, 7, 6, 0, 0, TAU); g.fill();
  g.strokeStyle = '#d8b8ff'; g.lineWidth = 1.6; g.shadowBlur = 0;
  for (const k of [-1, 1]) { g.beginPath(); g.moveTo(k * 3, -23); g.quadraticCurveTo(k * 8, -32, k * 3, -34); g.stroke(); }
  g.shadowColor = '#ffe14f'; g.shadowBlur = 8; g.fillStyle = '#ffe14f';
  for (const k of [-1, 1]) { g.beginPath(); g.ellipse(k * 3.2, -19, 2, 2.6, 0, 0, TAU); g.fill(); }
});
SP.swarm = makeSpr(36, g => {
  g.shadowColor = '#ff4f5a'; g.shadowBlur = 10;
  const gr = g.createLinearGradient(0, -14, 0, 12); gr.addColorStop(0, '#ffd0d4'); gr.addColorStop(.5, '#ff4f5a'); gr.addColorStop(1, '#5a0a12');
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, -14); g.lineTo(11, 10); g.lineTo(0, 4); g.lineTo(-11, 10); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -2, 2.2, 0, TAU); g.fill();
});
SP.dart = makeSpr(56, g => {
  g.shadowColor = '#ffd23f'; g.shadowBlur = 10;
  const gr = g.createLinearGradient(-14, 0, 14, 0); gr.addColorStop(0, '#7a5a00'); gr.addColorStop(.5, '#fff1b0'); gr.addColorStop(1, '#7a5a00');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, -25); g.lineTo(6, 4); g.lineTo(15, 18); g.lineTo(4, 14); g.lineTo(0, 22); g.lineTo(-4, 14); g.lineTo(-15, 18); g.lineTo(-6, 4); g.closePath(); g.fill();
  g.shadowBlur = 0; g.strokeStyle = 'rgba(80,50,0,.7)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, -20); g.lineTo(0, 16); g.stroke();
  g.shadowColor = '#ff6a00'; g.shadowBlur = 8; g.fillStyle = '#ff6a00'; g.beginPath(); g.arc(0, -4, 2.5, 0, TAU); g.fill();

SP.orbiter = makeSpr(64, g => {
  g.shadowColor = '#3ff0d0'; g.shadowBlur = 12;
  g.strokeStyle = '#1b8f7c'; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 20, 0, TAU); g.stroke();
  g.strokeStyle = '#7fffe9'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 20, 0, TAU); g.stroke();
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * TAU;
    g.fillStyle = '#d6fff8'; g.beginPath(); g.arc(Math.cos(a) * 20, Math.sin(a) * 20, 4.5, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(127,255,233,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 18, Math.sin(a) * 18); g.stroke();
  }
  const gr = g.createRadialGradient(-2, -2, 1, 0, 0, 9); gr.addColorStop(0, '#fff'); gr.addColorStop(.5, '#3ff0d0'); gr.addColorStop(1, '#0a4a40');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 9, 0, TAU); g.fill();
});
const SH = {};
for (const k in SP) SH[k] = silhouette(SP[k]);

// ----------------------------------------------------------- caza del jugador (vectorial, con alabeo 3D)
const PAL = { top: '#cfdbe6', under: '#5d6e80', glass: '#5fd8ff', mark: '#2a5bd7', flame: '#4fc3ff' };
const PAL_RED = { top: '#e87070', under: '#6a2020', glass: '#ffb0b0', mark: '#ffffff', flame: '#ff5050' };
function drawFighter(c, pal, roll, thrust, sil) {
  const co = Math.cos(roll), si = Math.sin(roll), under = co < 0;
  const sx = Math.abs(co) < .07 ? (co < 0 ? -.07 : .07) : co;
  if (!sil && thrust > 0) {
    c.globalCompositeOperation = 'lighter';
    for (const k of [-13, 13]) {
      const fl = thrust * (22 + Math.random() * 10);
      c.drawImage(glow(pal.flame), k * sx - 7, 20, 14, fl + 12);
      c.drawImage(glow('#ffffff'), k * sx - 3, 21, 6, fl * .45 + 6);
    }
    c.globalCompositeOperation = 'source-over';
  }
  c.save(); c.scale(sx, 1);
  const base = under ? pal.under : pal.top;
  const L = sil ? '#000' : shade(base, si * .4), R = sil ? '#000' : shade(base, -si * .4);
  const Ld = sil ? '#000' : shade(base, si * .4 - .3), Rd = sil ? '#000' : shade(base, -si * .4 - .3);
  // alas
  c.fillStyle = L; c.beginPath(); c.moveTo(0, -5); c.lineTo(-30, -5); c.quadraticCurveTo(-37, 0, -31, 6); c.lineTo(0, 6); c.fill();
  c.fillStyle = R; c.beginPath(); c.moveTo(0, -5); c.lineTo(30, -5); c.quadraticCurveTo(37, 0, 31, 6); c.lineTo(0, 6); c.fill();
  // estabilizador de cola
  c.fillStyle = L; c.fillRect(-18, 19, 18, 6); c.fillStyle = R; c.fillRect(0, 19, 18, 6);
  // botalones con motores
  for (const k of [-1, 1]) {
    c.fillStyle = k < 0 ? Ld : Rd; rrect(c, k * 13 - 4.5, -25, 9, 52, 4.5); c.fill();
    c.fillStyle = k < 0 ? L : R; rrect(c, k * 13 - 3, -23, 6, 46, 3); c.fill();
  }
  // gondola central
  if (sil) c.fillStyle = '#000';
  else { const ng = c.createLinearGradient(-7, 0, 7, 0); ng.addColorStop(0, L); ng.addColorStop(1, R); c.fillStyle = ng; }
  c.beginPath(); c.ellipse(0, -6, 6.5, 19, 0, 0, TAU); c.fill();
  if (!sil) {
    if (!under) {
      const gg = c.createLinearGradient(0, -22, 0, -2); gg.addColorStop(0, '#f0fdff'); gg.addColorStop(1, pal.glass);
      c.fillStyle = gg; c.beginPath(); c.ellipse(0, -12, 3.6, 7.5, 0, 0, TAU); c.fill();
      for (const k of [-1, 1]) {
        c.fillStyle = pal.mark; c.beginPath(); c.arc(k * 23, .5, 3.8, 0, TAU); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(k * 23, .5, 1.5, 0, TAU); c.fill();
      }
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-29, -5, 58, 1);
    } else {
      c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(-28, 1, 56, 1.5);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-2, -20, 4, 28);
    }
    c.fillStyle = 'rgba(230,240,255,.3)';
    for (const k of [-1, 1]) { c.beginPath(); c.ellipse(k * 13, -26, 9.5, 1.7, 0, 0, TAU); c.fill(); }
  }
  c.restore();
}

// ----------------------------------------------------------- escenario
// El mundo baja en franjas de 240 px: mar abierto, costa y ciudad futurista.
// Los edificios se dibujan con camara cenital en perspectiva: el techo se aleja
// del punto de fuga segun su altura, asi se ven las fachadas y hay paralaje real.
const TOD = [
  { top: '#0a4a8f', bot: '#1a7fc8', tint: [0, 0, 0, 0], wave: .55, night: 0, sun: 1 },
  { top: '#283a78', bot: '#d0663a', tint: [255, 120, 50, .16], wave: .45, night: .45, sun: .7 },
  { top: '#02081a', bot: '#0a2550', tint: [5, 10, 40, .42], wave: .22, night: 1, sun: 0 },
];
const STAGES = [
  { biome: 'sea', tod: 0, name: 'MEDIODIA EN EL PACIFICO' },
  { biome: 'city', tod: 1, name: 'ATARDECER SOBRE NEO-PACIFICA' },
  { biome: 'city', tod: 2, name: 'NOCHE EN LA METROPOLIS', boss: 'mother' },
  { biome: 'city', tod: 0, name: 'MEDIODIA EN EL DISTRITO ORBITAL' },
  { biome: 'sea', tod: 1, name: 'ATARDECER SOBRE LA FLOTA' },
  { biome: 'sea', tod: 2, name: 'TORMENTA EN ALTA MAR', boss: 'leviathan', storm: true },
];
function stageInfo(n) { return STAGES[(n - 1) % STAGES.length]; }
const hexRgb = h => rgbCache[h] || (rgbCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
function mixHex(a, b, k) { const A = hexRgb(a), B = hexRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }
let todFrom = 2, todTo = 2, todK = 1;
function setTod(i) { if (i === todTo) return; todFrom = todTo; todTo = i; todK = 0; }
function setTodNow(i) { todFrom = todTo = i; todK = 1; }
function curSky() {
  const a = TOD[todFrom], b = TOD[todTo], k = todK * todK * (3 - 2 * todK), m = (x, y) => x + (y - x) * k;
  return { top: mixHex(a.top, b.top, k), bot: mixHex(a.bot, b.bot, k), tint: a.tint.map((v, i) => m(v, b.tint[i])), wave: m(a.wave, b.wave), night: m(a.night, b.night), sun: m(a.sun, b.sun) };
}

const waveTex = (() => {
  const c = canvas(256, 256), g = c.getContext('2d');
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, w = rnd(6, 28), h = rnd(.8, 2.2);
    g.fillStyle = `rgba(255,255,255,${rnd(.05, .16)})`;
    for (const [dx, dy] of [[0, 0], [-256, 0], [0, -256], [-256, -256], [256, 0], [0, 256]]) {
      g.beginPath(); g.ellipse(x + dx, y + dy, w, h, 0, 0, TAU); g.fill();
    }
  }
  return c;
})();
// destellos del sol sobre el agua
const glintTex = (() => {
  const c = canvas(256, 256), g = c.getContext('2d');
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, w = rnd(1.5, 5);
    g.fillStyle = `rgba(255,250,225,${rnd(.35, .9)})`;
    for (const [dx, dy] of [[0, 0], [-256, 0], [0, -256], [-256, -256]]) { g.beginPath(); g.ellipse(x + dx, y + dy, w, .7, 0, 0, TAU); g.fill(); }
  }
  return c;
})();
let wavePat = null, glintPat = null;
function blobPath(g, R, a, k) {
  g.beginPath();
  for (let i = 0; i <= 56; i++) {
    const t = i / 56 * TAU, r = R * k * (1 + .2 * Math.sin(3 * t + a[0]) + .12 * Math.sin(5 * t + a[1]) + .06 * Math.sin(9 * t + a[2]));
    i ? g.lineTo(Math.cos(t) * r, Math.sin(t) * r) : g.moveTo(Math.cos(t) * r, Math.sin(t) * r);
  }
  g.closePath();
}
function makeIsland(s) {
  const c = canvas(s * 1.5, s * 1.5), g = c.getContext('2d');
  g.scale(1.5, 1.5); g.translate(s / 2, s / 2);
  const R = s * .27, a = [rnd(0, 6), rnd(0, 6), rnd(0, 6)];
  let gr = g.createRadialGradient(0, 0, R * .6, 0, 0, R * 1.75);
  gr.addColorStop(0, 'rgba(90,235,220,.6)'); gr.addColorStop(1, 'rgba(90,235,220,0)');
  g.fillStyle = gr; blobPath(g, R, a, 1.55); g.fill();
  g.fillStyle = '#eddc9f'; blobPath(g, R, a, 1); g.fill();
  gr = g.createRadialGradient(-R * .3, -R * .3, 2, 0, 0, R);
  gr.addColorStop(0, '#78c94f'); gr.addColorStop(1, '#1d5524');
  g.fillStyle = gr; blobPath(g, R, a, .8); g.fill();
  for (let i = 0; i < s / 3; i++) {
    const t = Math.random() * TAU, d = Math.sqrt(Math.random()) * R * .62;
    g.fillStyle = Math.random() < .55 ? 'rgba(15,55,22,.5)' : 'rgba(150,215,95,.35)';
    g.beginPath(); g.arc(Math.cos(t) * d, Math.sin(t) * d, rnd(2, 6), 0, TAU); g.fill();
  }
  return c;
}
function makeCloud(w) {
  const h = w * .55, c = canvas(w, h), cs = canvas(w, h), g = c.getContext('2d'), gs = cs.getContext('2d');
  const n = 10 + Math.random() * 7 | 0;
  for (let i = 0; i < n; i++) {
    const x = rnd(w * .22, w * .78), y = rnd(h * .38, h * .62), r = rnd(h * .18, h * .36);
    for (const [gg, col] of [[g, '255,255,255'], [gs, '0,10,30']]) {
      const gr = gg.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${col},.85)`); gr.addColorStop(.6, `rgba(${col},.45)`); gr.addColorStop(1, `rgba(${col},0)`);
      gg.fillStyle = gr; gg.beginPath(); gg.arc(x, y, r, 0, TAU); gg.fill();
    }
  }
  return { img: c, sh: cs };
}

// --- ciudad
const TILE = 240, PERSP = .0019, VPY = H * .55;
const ROOF_BASE = { concrete: '#7a828d', glass: '#24395a', helipad: '#5d6672', garden: '#2f6a3a', solar: '#2b3140', tech: '#d6dce4' };
const WALLS = ['#3b4556', '#2f3a4d', '#4a5262', '#283246', '#56606f', '#3a3550', '#2d4a55'];
const NEON = ['#4fe3ff', '#ff4fd8', '#ffd23f', '#59ff9a', '#ff6a3d'];
let tiles = [], buildings = [], cars = [], ships = [], AVX = [], lastKind = 'city', biome = 'city', terrainW = 0;
let scrollY = 0, islands = [], lowClouds = [], highClouds = [], islandT = 2, lowT = 1, highT = 4, shipT = 3, carT = 0, carrierY = H + 400;
let storm = 0, stormOn = false, rain = [], lightning = 0, boltT = 5;

function makeRoof(w, d, style) {
  const c = canvas(w * 1.5, d * 1.5), g = c.getContext('2d'); g.scale(1.5, 1.5);
  g.fillStyle = ROOF_BASE[style]; g.fillRect(0, 0, w, d);
  const m = Math.min(w, d);
  if (style === 'glass') {
    const gr = g.createLinearGradient(0, 0, w, d);
    gr.addColorStop(0, 'rgba(150,200,255,.45)'); gr.addColorStop(.45, 'rgba(150,200,255,.02)'); gr.addColorStop(1, 'rgba(150,200,255,.25)');
    g.fillStyle = gr; g.fillRect(0, 0, w, d);
    g.strokeStyle = 'rgba(8,16,32,.55)'; g.lineWidth = 1; g.beginPath();
    for (let x = 8; x < w; x += 10) { g.moveTo(x, 0); g.lineTo(x, d); }
    for (let y = 8; y < d; y += 10) { g.moveTo(0, y); g.lineTo(w, y); }
    g.stroke();
  } else if (style === 'solar') {
    g.fillStyle = '#2a4f96';
    for (let x = 5; x < w - 9; x += 11) for (let y = 5; y < d - 6; y += 8) g.fillRect(x, y, 9, 6);
    g.fillStyle = 'rgba(200,230,255,.18)';
    for (let x = 5; x < w - 9; x += 11) g.fillRect(x, 5, 2, d - 10);
  } else if (style === 'helipad') {
    const r = m * .36;

// ----------------------------------------------------------- efectos
function explode(x, y, size, col) {

  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(40, 260) * Math.sqrt(size);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.3, .9), m: .9, s: rnd(6, 16) * Math.sqrt(size), col: pick([col, '#ffd23f', '#ff8a3d', '#ffffff']) });
  }
  for (let i = 0; i < 4 + size * 3; i++) {
    const a = Math.random() * TAU, s = rnd(60, 200);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.5, 1.1), m: 1.1, s: rnd(2, 4), col: '#3a3f4a', debris: true, rot: rnd(0, 6) });
  }

  rings.push({ x, y, l: .45, m: .45, R: 40 * size, col });

  if (msg && (msg.l -= dt) <= 0) msg = null;

// ----------------------------------------------------------- update
function update(dt) {
  T += dt;
  updBg(dt);
  if (state === 'title') { titleT += dt; updFx(dt); return; }
  if (state === 'gameover') { goT += dt; updFx(dt); for (const e of enemies) updEnemy(e, dt); enemies = enemies.filter(e => !e.dead); return; }
  if (paused) return;

  formT += dt;
  swayAmp = allIn ? Math.max(0, swayAmp - dt * 20) : 30;
  breathAmp = allIn ? Math.min(1, breathAmp + dt * .5) : 0;
  if (chainT > 0 && (chainT -= dt) <= 0) { chain = 0; mult = 1; }

  updPlayer(dt);

  if (intro > 0) intro -= dt;
  else {
    stageT += dt;
    if (bossStage) { if (!bossSpawned && stageT > .5) { boss = stageInfo(stage).boss === 'mother' ? makeMother() : makeLeviathan(); bossSpawned = true; } }
    else {
      if (groupIdx < GROUPS.length) {
        groupT -= dt;
        const entering = enemies.some(e => e.row !== undefined && (e.state === 'wait' || e.state === 'enter'));
        if (groupT <= 0 && !entering) { spawnGroup(GROUPS[groupIdx]); groupIdx++; groupT = 1.1; }
      } else if (!allIn && enemies.every(e => e.row === undefined || !['wait', 'enter', 'toSlot'].includes(e.state))) allIn = true;
      if (evIdx < events.length && stageT >= events[evIdx].t) { spawnEvent(events[evIdx].type); evIdx++; }
      if (allIn || (stage >= 3 && groupIdx >= 3)) {
        if ((diveT -= dt) <= 0) { diveT = Math.max(.45, 2.2 - stage * .15) * rnd(.6, 1.3); if (player.alive) launchDive(); }
      }
      if (stage >= 2 && (formFireT -= dt) <= 0) {
        formFireT = rnd(1.2, 2.4) / (1 + stage * .15);
        const f = enemies.filter(e => e.state === 'form');
        if (f.length && player.alive) { const e = pick(f); eFire(e.x, e.y, aimTo(e.x, e.y)); }
      }
    }
  }

  for (const sw of swarms) {
    sw.t += dt;
    const dir = sw.side ? -1 : 1;
    if (sw.t < 4) { sw.lx += dir * 260 * dt; sw.ly += Math.sin(sw.t * 2.5) * 140 * dt; }
    else if (sw.t < 10) { if (player.alive) { sw.lx += (player.x - sw.lx) * dt * 1.1; sw.ly += (player.y - sw.ly) * dt * .9; } }
    else sw.ly -= 380 * dt;
  }
  for (const e of enemies) updEnemy(e, dt);
  if (boss) { boss.update(dt); if (boss.done) boss = null; }

  if (capture) {
    const c = capture, b = c.boss; c.a += dt * 12;
    const [tx, ty] = captivePos(b), dx = tx - c.x, dy = ty - c.y, L = Math.hypot(dx, dy), s = 170 * dt;
    if (L <= s) { b.captive = true; capture = null; b.state = 'toSlot'; loseLife(); }
    else { c.x += dx / L * s; c.y += dy / L * s; }
  }
  if (rescue) {
    const r = rescue, p = player; r.a += dt * 9;
    if (!p.alive) r.y = Math.min(r.y + 60 * dt, H - 200);
    else {
      const [tx, ty] = shipPos(1), dx = tx - r.x, dy = ty - r.y, L = Math.hypot(dx, dy), s = 300 * dt;
      if (L <= s) { p.dual = true; rescue = null; sfx.pow(); showMsg('CAZA DOBLE!', '#4fe3ff'); }
      else { r.x += dx / L * s; r.y += dy / L * s; }
    }
  }

  updLaser(dt);

  // proyectiles del jugador
  for (const b of pshots) {
    if (b.kind === 'm') {
      if (!b.target || b.target.dead || !hittable(b.target)) b.target = nearestEnemy(b.x, b.y, 900);
      b.sp = Math.min(820, b.sp + 1100 * dt);
      if (b.target) { const want = Math.atan2(b.target.x - b.x, -(b.target.y - b.y)); b.ang = lerpA(b.ang, want, dt * 7); }

      if (Math.random() < .8) parts.push({ x: b.x, y: b.y, vx: rr(20), vy: rr(20), l: .35, m: .35, s: 7, col: '#ff8a3d' });
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
    for (const e of enemies) {
      if (!hittable(e) || (b.hit && b.hit.has(e))) continue;
      let hitIt = false;
      for (const [cx, cy, cr] of enemyCircles(e)) if (Math.hypot(b.x - cx, b.y - cy) < cr + b.r) { hitIt = true; break; }
      if (!hitIt) continue;
      if (b.kind === 'p') { b.hit.add(e); damage(e, b.dmg, b.x, b.y); burst(b.x, b.y, 8, '#ff4fd8', 200); continue; }
      damage(e, b.dmg, b.x, b.y); b.dead = true;
      if (b.kind === 'm') {
        burst(b.x, b.y, 10, '#ff8a3d', 220); rings.push({ x: b.x, y: b.y, l: .25, m: .25, R: 40, col: '#ff8a3d' });
        for (const o of enemies) if (o !== e && hittable(o) && Math.hypot(o.x - b.x, o.y - b.y) < 55) damage(o, 1.2, o.x, o.y, true);
      } else burst(b.x, b.y, 3, '#ffd23f', 120);
      break;
    }
    // partes del jefe; si no da en ninguna, el casco frena el disparo
    if (!b.dead && boss) {
      for (const p of bossTargets()) {
        if ((b.hit && b.hit.has(p)) || Math.hypot(b.x - p.x, b.y - p.y) > p.r + b.r) continue;
        if (b.kind === 'p') { b.hit.add(p); partDamage(p, b.dmg, b.x, b.y); burst(b.x, b.y, 8, '#ff4fd8', 200); continue; }
        partDamage(p, b.dmg, b.x, b.y); b.dead = true;
        burst(b.x, b.y, b.kind === 'm' ? 10 : 3, b.kind === 'm' ? '#ff8a3d' : '#ffd23f', 160);
        break;
      }
      if (!b.dead && boss && boss.blocks(b.x, b.y)) { b.dead = true; burst(b.x, b.y, b.kind === 'p' ? 8 : 3, '#ffe6a0', 140); }
    }
    // el caza capturado tambien se puede derribar (como en Galaga)
    if (!b.dead) for (const e of enemies) if (e.captive && !e.dead) {
      const [cx, cy] = captivePos(e);
      if (Math.hypot(b.x - cx, b.y - cy) < 18) { e.captive = false; b.dead = true; explode(cx, cy, 1, '#ff5050'); showMsg('DERRIBASTE TU PROPIO CAZA', '#ff5050'); break; }
    }
  }
  pshots = pshots.filter(b => !b.dead && b.l > 0 && b.x > -60 && b.x < W + 60 && b.y > -60 && b.y < H + 60);

  // bombas
  for (const s of shock) {
    s.r += 1500 * dt;
    eshots = eshots.filter(b => { if (Math.hypot(b.x - s.x, b.y - s.y) < s.r) { if (Math.random() < .3) burst(b.x, b.y, 2, b.col, 80); return false; } return true; });

  }

  // disparos enemigos
  for (const b of eshots) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (!player.alive) continue;
    for (const i of (player.dual ? [0, 1] : [0])) {
      const [sx, sy] = shipPos(i);
      if (Math.hypot(b.x - sx, b.y - sy) < b.r + 8) {

        b.dead = true; hurtPlayer(i); break;
      }
    }
  }
  eshots = eshots.filter(b => !b.dead && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  // choques
  if (player.alive) for (const e of enemies) {
    if (!hittable(e) || e.state === 'form') continue;
    for (const i of (player.dual ? [0, 1] : [0])) {
      const [sx, sy] = shipPos(i);
      if (enemyCircles(e).some(([cx, cy, cr]) => Math.hypot(cx - sx, cy - sy) < cr + 14)) {

        damage(e, 6, e.x, e.y);

      }
    }

  // items

  updFx(dt);

  const done = bossStage ? (bossSpawned && !boss && !enemies.length) : (groupIdx >= GROUPS.length && evIdx >= events.length && !enemies.length);
  if (state === 'play' && intro <= 0 && clearT === 0 && done && !capture && !rescue) {

    ctx.strokeStyle = 'rgba(79,227,255,.35)'; ctx.lineWidth = L.w * 2.6 * fl; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(79,227,255,.8)'; ctx.lineWidth = L.w * fl; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = L.w * .35; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.drawImage(glow('#4fe3ff'), L.x - 22, L.y - 22, 44, 44);
    if (L.len < 1800) ctx.drawImage(glow('#ffffff'), ex - 18, ey - 18, 36, 36);
  }
  for (const b of pshots) {
    if (b.kind === 'v') {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
      ctx.drawImage(glow('#ffd23f'), -6, -16, 12, 32); ctx.fillStyle = '#fffbe0'; ctx.fillRect(-1.2, -8, 2.4, 16);
      ctx.restore();
    } else if (b.kind === 'm') {
      ctx.drawImage(glow('#ff8a3d'), b.x - 14, b.y - 14, 28, 28);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang); ctx.fillStyle = '#fff'; ctx.fillRect(-2, -6, 4, 12); ctx.restore();
    } else {
      const r = b.r * (1 + Math.sin(T * 30) * .12);
      ctx.drawImage(glow('#ff4fd8'), b.x - r * 2.4, b.y - r * 2.4, r * 4.8, r * 4.8);
      ctx.drawImage(glow('#ffffff'), b.x - r, b.y - r, r * 2, r * 2);
    }
  }
  for (const b of eshots) {
    ctx.drawImage(glow(b.col), b.x - b.r * 2.6, b.y - b.r * 2.6, b.r * 5.2, b.r * 5.2);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff';
  for (const b of eshots) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .5, 0, TAU); ctx.fill(); }
}
function drawFx() {
  for (const p of parts) if (p.debris) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.globalAlpha = Math.min(1, p.l * 2); ctx.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); ctx.restore();
  }
  ctx.fillStyle = '#2a2a33';
  for (const p of parts) if (p.smoke) {
    const k = p.l / p.m; ctx.globalAlpha = .45 * k;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1.7 - k * .8), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) if (!p.debris && !p.smoke) {
    const k = p.l / p.m, s = p.s * (.4 + k * .6);
    ctx.globalAlpha = Math.min(1, k * 1.4); ctx.drawImage(glow(p.col), p.x - s, p.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    const k = 1 - r.l / r.m;
    ctx.strokeStyle = r.col; ctx.globalAlpha = (1 - k) * .8; ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, k * r.R + 4, 0, TAU); ctx.stroke();
  }
  for (const s of shock) {
    ctx.globalAlpha = clamp(1 - s.r / (Math.max(W, H) * 1.3), 0, 1);
    ctx.strokeStyle = '#bfefff'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * .92, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.l * 2); text(p.s, p.x, p.y, p.col, 15, 'center', 'Orbitron'); }
  ctx.globalAlpha = 1;
}
function drawItems() {
  for (const it of items) {
    if (it.t > 11 && (T * 10 | 0) % 2) continue;
    const col = PK[it.kind];
    addGlow(it.x, it.y, 34, col, .55);
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(T * 1.5);
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(5,10,25,.75)';
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17); } ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    text(it.kind === '1' ? '1UP' : it.kind, it.x, it.y + 1, '#fff', it.kind === '1' ? 10 : 15, 'center', 'Orbitron');
  }
}
function drawDartTelegraph() {
  for (const e of enemies) if (e.state === 'dartAim') {
    const [fx, fy] = fwd(e.ang), a = .25 + .35 * Math.abs(Math.sin(T * 14));
    ctx.strokeStyle = `rgba(255,210,63,${a})`; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + fx * 1400, e.y + fy * 1400); ctx.stroke(); ctx.setLineDash([]);
  }
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(4,10,24,.55)'; rrect(ctx, x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(120,200,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
}
function drawHUD() {
  panel(10, 10, 230, 62);
  text(String(score).padStart(8, '0'), 22, 32, '#fff', 22, 'left', 'Orbitron');
  if (mult > 1) {
    text('x' + mult + ' COMBO', 22, 56, '#ffd23f', 13, 'left', 'Orbitron', '#ffd23f');
    ctx.fillStyle = 'rgba(255,210,63,.3)'; ctx.fillRect(130, 52, 96, 6); ctx.fillStyle = '#ffd23f'; ctx.fillRect(130, 52, 96 * chainT / 2.2, 6);
  } else text('PUNTOS', 22, 56, 'rgba(160,200,255,.7)', 12, 'left', 'Orbitron');
  text('RECORD ' + hi, W / 2, 24, 'rgba(160,200,255,.8)', 13, 'center', 'Orbitron');
  panel(W - 130, 10, 120, 40);
  text('ETAPA ' + stage, W - 70, 30, '#ffd23f', 15, 'center', 'Orbitron');
  if (boss && boss.state !== 'intro') {
    const bw = Math.min(460, W - 300), bx = W / 2 - bw / 2, col = boss.kind === 'mother' ? '#ff4fd8' : '#59ffda';
    text(boss.name, W / 2, 88, col, 12, 'center', 'Orbitron', col);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 2, 96, bw + 4, 14);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, col); g.addColorStop(1, '#ffd23f');
    ctx.fillStyle = g; ctx.fillRect(bx, 98, bw * bossHpRatio(boss), 10);
    // marcas de cada parte destructible
    let acc = 0; const tot = boss.parts.reduce((s, p) => s + p.maxhp, 0);
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    for (const p of boss.parts) { acc += p.maxhp; if (acc < tot) ctx.fillRect(bx + bw * acc / tot - 1, 98, 2, 10); }
    if (boss.tip) text(boss.tip, W / 2, 126, 'rgba(255,235,245,.9)', 15, 'center', 'Rajdhani');
  }
  const p = player, by = H - 62;
  panel(10, by, 200, 52);
  for (let i = 0; i < Math.min(lives, 6); i++) { ctx.save(); ctx.translate(30 + i * 30, by + 18); ctx.scale(.36, .36); drawFighter(ctx, PAL, 0, 0, false); ctx.restore(); }
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < p.shield ? '#59ff9a' : 'rgba(89,255,154,.15)';
    ctx.beginPath(); const x = 24 + i * 34, y = by + 40;
    ctx.moveTo(x, y - 5); ctx.lineTo(x + 26, y - 5); ctx.lineTo(x + 22, y + 5); ctx.lineTo(x - 4, y + 5); ctx.fill();
  }
  text('ESCUDO', 132, by + 40, 'rgba(160,255,200,.7)', 11, 'left', 'Orbitron');
  const ww = 92, wx0 = W / 2 - ww * 2 - 6, wy = W < 820 ? by - 58 : by;
  for (let i = 0; i < 4; i++) {
    const x = wx0 + i * (ww + 4), sel = p.w === i, lv = p.wlv[i], col = WEAPONS[i].col, by = wy;
    ctx.fillStyle = sel ? 'rgba(10,20,40,.85)' : 'rgba(4,10,24,.5)'; rrect(ctx, x, by, ww, 52, 8); ctx.fill();
    ctx.strokeStyle = sel ? col : 'rgba(120,200,255,.2)'; ctx.lineWidth = sel ? 2 : 1; ctx.stroke();
    text((i + 1) + ' ' + (lv ? WEAPONS[i].name : '- - -'), x + ww / 2, by + 18, lv ? (sel ? col : 'rgba(255,255,255,.7)') : 'rgba(255,255,255,.25)', 11, 'center', 'Orbitron', sel ? col : null);
    for (let k = 0; k < 3; k++) { ctx.fillStyle = k < lv ? col : 'rgba(255,255,255,.12)'; ctx.fillRect(x + 18 + k * 20, by + 36, 16, 5); }
  }
  panel(W - 180, by, 170, 52);
  for (let i = 0; i < bombs; i++) { addGlow(W - 160 + i * 22, by + 18, 12, '#ffffff', .5); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W - 160 + i * 22, by + 18, 6, 0, TAU); ctx.fill(); }
  text('BOMBA [B]', W - 166, by + 40, 'rgba(255,255,255,.6)', 10, 'left', 'Orbitron');
  const rc = p.rollCD > 0 ? 1 - p.rollCD / 1.1 : 1;
  ctx.strokeStyle = 'rgba(79,227,255,.2)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(W - 34, by + 26, 15, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rc >= 1 ? '#4fe3ff' : 'rgba(79,227,255,.6)'; ctx.beginPath(); ctx.arc(W - 34, by + 26, 15, -Math.PI / 2, -Math.PI / 2 + TAU * rc); ctx.stroke();
  text('GIRO', W - 34, by + 26, rc >= 1 ? '#4fe3ff' : 'rgba(79,227,255,.4)', 8, 'center', 'Orbitron');
  if (touchUsed) drawTouch();
}
function drawTouch() {
  for (const b of touchButtons()) {
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    text(b.label, b.x, b.y, 'rgba(255,255,255,.75)', 11, 'center', 'Orbitron');
  }
  if (stick.id !== null) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 70, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(stick.ox + stick.dx * 70, stick.oy + stick.dy * 70, 28, 0, TAU); ctx.fill();
  }
}
function drawTitle() {
  ctx.fillStyle = 'rgba(2,6,16,.5)'; ctx.fillRect(0, 0, W, H);
  text('RECORD ' + hi, W / 2, 34, 'rgba(160,200,255,.85)', 15, 'center', 'Orbitron');
  text('GALAXIA', W / 2, 130, '#4fe3ff', 64, 'center', 'Orbitron', '#4fe3ff');
  text('1942', W / 2, 200, '#ff4f6a', 72, 'center', 'Orbitron', '#ff4f6a');
  text('UN CAZA DE HELICE CONTRA LA INVASION', W / 2, 252, 'rgba(255,255,255,.75)', 18, 'center', 'Rajdhani');
  // caza de demostracion haciendo toneles
  const q = (titleT % 3) / 3, roll = q > .55 && q < .85 ? (q - .55) / .3 * TAU : Math.sin(titleT * 2) * .4;
  ctx.save(); ctx.translate(W / 2, 360); ctx.rotate(Math.sin(titleT * .7) * .25); ctx.scale(1.6, 1.6);
  drawFighter(ctx, PAL, roll, 1, false); ctx.restore();
  const row = (img, s, y, x0) => { ctx.drawImage(img, x0 - 22, y - 22, 44, 44); text(s, x0 + 32, y, '#dfe8ff', 17, 'left', 'Rajdhani'); };
  const cx = W / 2 - 230;
  row(SP.drone, 'ZANGANO  100', 470, cx); row(SP.mantis, 'MANTIS  160', 515, cx); row(SP.swarm, 'ENJAMBRE = ARMA', 560, cx);
  row(SP.dart, 'DARDO  150', 470, cx + 250); row(SP.orbiter, 'ORBITADOR  300', 515, cx + 250);
  ctx.save(); ctx.translate(cx + 250, 560); ctx.scale(.6, .6); drawKraken({ hp: 1, maxhp: 1 }); ctx.restore();
  text('KRAKEN: TE CAPTURA', cx + 282, 560, '#dfe8ff', 17, 'left', 'Rajdhani');
  const lines = touchUsed
    ? ['ARRASTRA: MOVER Y DISPARAR (AUTO-APUNTA)', 'BOTONES: GIRO · BOMBA · ARMA']
    : ['WASD / FLECHAS  mover en todas direcciones', 'RATON  apuntar y disparar   ·   Q / E  girar la nave', 'ESPACIO  disparar   ·   SHIFT / clic der.  tonel evasivo', '1-4 / TAB / rueda  cambiar arma   ·   B  bomba   ·   P  pausa'];
  lines.forEach((s, i) => text(s, W / 2, 630 + i * 28, 'rgba(200,225,255,.85)', 18, 'center', 'Rajdhani'));
  text('RESCATA TU CAZA CAPTURADO PARA VOLAR EN DOBLE', W / 2, 760, '#4fe3ff', 16, 'center', 'Rajdhani');
  if ((titleT * 2 | 0) % 2 === 0) text(touchUsed ? 'TOCA PARA DESPEGAR' : 'PULSA ESPACIO PARA DESPEGAR', W / 2, 820, '#ffd23f', 22, 'center', 'Orbitron', '#ffd23f');
}
function draw() {
  ctx.setTransform(VS, 0, 0, VS, 0, 0);
  ctx.save();
  if (shake > .3) ctx.translate(rr(shake), rr(shake));
  drawBackground();
  if (state === 'title') {
    ctx.globalAlpha = .3; for (const c of highClouds) ctx.drawImage(c.img, c.x, c.y, c.w * 1.3, c.w * .55 * 1.3); ctx.globalAlpha = 1;
    ctx.restore(); drawTitle(); return;
  }
  if (boss) boss.drawShadow();
  drawShadows();
  if (boss) boss.draw();
  drawItems();
  for (const e of enemies) if (e.state === 'beam') drawBeam(e);
  drawDartTelegraph();
  for (const e of enemies) if (e.state !== 'wait') drawEnemy(e);
  if (capture) { ctx.save(); ctx.translate(capture.x, capture.y); ctx.rotate(capture.a); drawFighter(ctx, PAL, 0, 0, false); ctx.restore(); }
  if (rescue) { ctx.save(); ctx.translate(rescue.x, rescue.y); ctx.rotate(rescue.a); drawFighter(ctx, PAL, 0, .5, false); ctx.restore(); addGlow(rescue.x, rescue.y, 50, '#59ff9a', .4); }

  drawShots();
  drawFx();

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,10,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (banner) {
    const a = Math.min(1, banner.l * 2, (3 - banner.l) * 3);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(2,6,16,.55)'; ctx.fillRect(0, H / 2 - 80, W, 120);
    text(banner.a, W / 2, H / 2 - 36, banner.col, 42, 'center', 'Orbitron', banner.col);
    text(banner.b, W / 2, H / 2 + 12, '#dfe8ff', 20, 'center', 'Rajdhani');
    ctx.globalAlpha = 1;
  }
  if (msg) { ctx.globalAlpha = Math.min(1, msg.l * 2); text(msg.s, W / 2, H * .62, msg.c, 20, 'center', 'Orbitron', msg.c); ctx.globalAlpha = 1; }
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(2,6,16,.6)'; ctx.fillRect(0, H / 2 - 110, W, 200);
    text('FIN DE LA MISION', W / 2, H / 2 - 54, '#ff4f6a', 44, 'center', 'Orbitron', '#ff4f6a');
    text('PUNTOS ' + score + '   ·   ETAPA ' + stage, W / 2, H / 2, '#fff', 20, 'center', 'Orbitron');
    if (goT > 1.5 && (T * 2 | 0) % 2) text(touchUsed ? 'TOCA PARA CONTINUAR' : 'PULSA ESPACIO', W / 2, H / 2 + 50, '#ffd23f', 18, 'center', 'Orbitron');
  }
  if (paused) {
    ctx.fillStyle = 'rgba(2,6,16,.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSA', W / 2, H / 2 - 20, '#fff', 48, 'center', 'Orbitron', '#4fe3ff');
    text(touchUsed ? 'toca para seguir' : 'P o ESPACIO para seguir   ·   M sonido ' + (muted ? 'OFF' : 'ON'), W / 2, H / 2 + 30, 'rgba(200,225,255,.85)', 18, 'center', 'Rajdhani');
  }
}

// ----------------------------------------------------------- bucle
let last = performance.now();
function frame(now) {
  let dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (slowT > 0) { slowT -= dt; dt *= .35; }
  update(dt);
  laserSound(state === 'play' && !paused && player.alive && player.firing && player.w === 1);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// el canvas no dispara la carga de fuentes por si solo
if (document.fonts) ['700 16px Orbitron', '500 16px Rajdhani', '700 16px Rajdhani'].forEach(f => document.fonts.load(f).catch(() => {}));
// modo sin conexion: guarda el juego en el aparato la primera vez que se abre
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
